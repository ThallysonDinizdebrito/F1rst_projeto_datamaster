# This is a Databricks asset bundle definition for masterdatabricks.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: masterdatabricks
  uuid: 5c69008a-5003-4e11-8a66-54af4a09c4f6

# artifacts:
#   python_artifact:
#     type: whl
#     build: uv build --wheel

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets:
      name_prefix: dev_${workspace.current_user.short_name}
      source_linked_deployment: false
    workspace:
      host: https://dbc-f6335a1e-53be.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://dbc-f6335a1e-53be.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/thallysongreif@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/thallysongreif@gmail.com/DEV/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - group_name: admins
        level: CAN_MANAGE