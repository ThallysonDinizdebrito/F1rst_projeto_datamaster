name: Deploy Dev teste

on:
  push:
    branches:
      - dev

jobs:
  terraform:
    name: Terraform Dev
    runs-on: ubuntu-latest

    steps:
      - name: Checar repositório
        uses: actions/checkout@v3

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.7.0

      # --- Debug e validação do secret ---
      - name: Validar secret Azure
        run: |
          echo "Verificando se o secret AZURE_CREDENTIALS_DEV está presente..."
          if [ -z "${{ secrets.AZURE_CREDENTIALS_DEV }}" ]; then
            echo "ERROR: Secret AZURE_CREDENTIALS_DEV não encontrado!"
            exit 1
          fi
          echo "${{ secrets.AZURE_CREDENTIALS_DEV }}" | jq . >/dev/null 2>&1
          if [ $? -ne 0 ]; then
            echo "ERROR: Secret AZURE_CREDENTIALS_DEV não é um JSON válido!"
            exit 1
          fi
          echo "Secret validado com sucesso."

      - name: Autenticar no Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_DEV }}

      - name: Inicializar Terraform
        run: terraform init \
          -backend-config="storage_account_name=${{ secrets.AZURE_STORAGE_ACCOUNT_DEV }}" \
          -backend-config="container_name=tfstate" \
          -backend-config="key=terraform.tfstate" \
          -backend-config="resource_group_name=rg-backend-dev" \
          -reconfigure
        working-directory: infra

      - name: Executar Terraform Plan
        run: terraform plan -var-file=dev.tfvars
        working-directory: infra

      - name: Executar Terraform Apply
        run: terraform apply -auto-approve -var-file=dev.tfvars
        working-directory: infra
