name: Test Azure Secret

on:
  push:
    branches:
      - dev

jobs:
  test-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Checar repositório
        uses: actions/checkout@v3

      - name: Testar leitura do secret
        run: |
          echo "Verificando se o secret AZURE_CREDENTIALS_DEV está acessível"
          echo "${{ secrets.AZURE_CREDENTIALS_DEV }}" > secret.json
          cat secret.json | jq '{clientId, subscriptionId, tenantId}'
