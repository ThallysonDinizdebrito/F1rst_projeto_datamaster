# 🚀 Deploy do código para Azure Function - Validate Blob
      - name: 'Azure Functions Action - Validate Blob'
        uses: Azure/functions-action@v1
        with:
          app-name: rg-dev-projeto-func-validate   # nome da azure function no main.tf
          package: './azure_function/ValidacaoData'            # envia o código da pasta atual
          enable-oryx-build: true
          scm-do-build-during-deployment: true

        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

