name: Deploy-resources-dev

on:
  push:
    branches:
      - dev

jobs:
  infra_functions:
    runs-on: ubuntu-latest
    environment: dev

    concurrency:
      group: terraform-dev
      cancel-in-progress: true

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      TF_VAR_secreto_do_cliente: ${{ secrets.AZURE_CLIENT_SECRET }}
      TF_VAR_id_do_cliente: ${{ secrets.AZURE_CLIENT_ID }}
      TF_VAR_id_do_tenant: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_id_da_subscricao: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      AZURE_FUNCTIONAPP_NAME_VALIDATE: rg-dev-projeto-func-init
      AZURE_FUNCTIONAPP_NAME: rg-dev-projeto-func
      AZURE_RESOURCE_GROUP: rg-dev-projeto
      LOCATION: westeurope
      STORAGE_ACCOUNT: devprojetoarmazen
      SERVICE_PLAN: rg-dev-projeto-func-plan

    steps:
      # 1. Checkout do código
      - name: Checkout repository
        uses: actions/checkout@v3

      - uses: hashicorp/setup-terraform@v2 
        with: 
          terraform_version: 1.7.0 
      - name: Terraform Init 
        run: terraform -chdir=infra init 
      - name: Terraform Apply Infra 
        run: terraform -chdir=infra apply -auto-approve -var-file=dev.tfvars -target=azurerm_resource_group.grupo_principal -target=azurerm_storage_account.conta_armazenamento -target=azurerm_storage_container.container_raw -target=azurerm_storage_container.container_validado -target=azurerm_storage_container.container_rejeitados -target=azurerm_linux_function_app.function_app

      # 2. Login no Azure
      - name: Azure CLI Login
        uses: azure/login@v1
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      # 3. Setup Node.js (pré-requisito para func CLI)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      # 4. Cache npm global
      - name: Cache npm
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # 5. Instalar Azure Functions Core Tools
      - name: Install Azure Functions Core Tools
        run: |
          npm install -g azure-functions-core-tools@4 --unsafe-perm true

      # 6. Deploy de todas as Functions
      - name: Deploy Functions
        run: |
          for func_dir in ./azure_function/functionvalidacao ./azure_function/GeracaoData; do
            echo "Deploying $func_dir..."

        # 6.1 Setup Python
            python -m pip install --upgrade pip
            pip install -r $func_dir/requirements.txt

        # 6.2 Deploy via func CLI
            if [[ "$func_dir" == *"functionvalidacao"* ]]; then
              func azure functionapp publish ${{ env.AZURE_FUNCTIONAPP_NAME_VALIDATE }} --build remote --python --force
            else
              func azure functionapp publish ${{ env.AZURE_FUNCTIONAPP_NAME }} --build remote --python --force
            fi
          done

  eventgrid:
    runs-on: ubuntu-latest
    environment: dev
    needs: infra_functions
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      TF_VAR_secreto_do_cliente: ${{ secrets.AZURE_CLIENT_SECRET }}
      TF_VAR_id_do_cliente: ${{ secrets.AZURE_CLIENT_ID }}
      TF_VAR_id_do_tenant: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_id_da_subscricao: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


    steps: 
    - name: Test Print
      run: echo "Este é um print no segundo job dev."

