name: Deploy Dev

on:
  push:
    branches:
      - dev

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: dev

    env: 
      TF_VAR_id_da_subscricao: ${{ secrets.AZURE_SUBSCRIPTION_ID_DEV }}
      TF_VAR_id_do_cliente: ${{ secrets.AZURE_CLIENT_ID_DEV }}
      TF_VAR_secreto_do_cliente: ${{ secrets.AZURE_CLIENT_SECRET_DEV }}
      TF_VAR_id_do_tenant: ${{ secrets.AZURE_TENANT_ID_DEV }}

      

    concurrency:
      group: terraform-dev
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v3

      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.7.0

      # Inicialização do Terraform
      - name: Terraform Init
        working-directory: infra
        run: terraform init -reconfigure

      # Criação do plano do Terraform
      - name: Terraform Plan
        working-directory: infra
        run: terraform plan -var-file=dev.tfvars -lock-timeout=300s

      # Aplica as alterações do Terraform
      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve -var-file=dev.tfvars -lock-timeout=300s
