name: Deploy-resources-dev

on:
  push:
    branches:
      - dev
jobs:
  setup-tf-backend:
    runs-on: ubuntu-latest
    environment: dev

    env:
      # Autenticação para Terraform
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Variáveis Terraform (se você usa TF_VAR_* no código)
      TF_VAR_secreto_do_cliente: ${{ secrets.AZURE_CLIENT_SECRET }}
      TF_VAR_id_do_cliente: ${{ secrets.AZURE_CLIENT_ID }}
      TF_VAR_id_do_tenant: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_id_da_subscricao: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Variáveis fixas para backend
      AZURE_RESOURCE_GROUP: rg-backend-dev
      AZURE_LOCATION: brazilsouth
      STORAGE_ACCOUNT: estadotfdev
      AZURE_BLOB: tfstate


    steps:
      - name: Azure CLI Login
        uses: azure/login@v1
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Create Resource Group (if not exists)
        run: |
          if ! az group show --name ${{ env.AZURE_RESOURCE_GROUP }} &>/dev/null; then
            echo "Resource Group não existe. Criando..."
            az group create \
              --name ${{ env.AZURE_RESOURCE_GROUP }} \
              --location ${{ env.AZURE_LOCATION }}
          else
            echo "Resource Group já existe. Pulando criação."
          fi

      - name: Create Storage Account (if not exists)
        run: |
          if ! az storage account show --name ${{ env.STORAGE_ACCOUNT }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} &>/dev/null; then
            echo "Storage Account não existe. Criando..."
            az storage account create \
              --name ${{ env.STORAGE_ACCOUNT }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --location ${{ env.AZURE_LOCATION }} \
              --sku Standard_LRS
          else
            echo "Storage Account já existe. Pulando criação."
          fi

      - name: Create Blob Container for TF State (if not exists)
        run: |
          if ! az storage container show --name  ${{ env.AZURE_BLOB }} --account-name ${{ env.STORAGE_ACCOUNT }} &>/dev/null; then
            echo "Blob Container não existe. Criando..."
            az storage container create \
              --name ${{ env.AZURE_BLOB }} \
              --account-name ${{ env.STORAGE_ACCOUNT }}
          else
            echo "Blob Container já existe. Pulando criação."
          fi

