###################################################################################
# GRAFANA DEPLOY
###################################################################################


  deploy_grafana:
    runs-on: ubuntu-latest
    environment: dev
    needs: deploy_databricks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Azure CLI Login
        uses: azure/login@v1
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Set workspace ID
        run: |
          echo "WORKSPACE_ID=/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/rg-dev-projeto/providers/Microsoft.OperationalInsights/workspaces/law-rg-dev-projeto-dev" >> $GITHUB_ENV

      - name: Generate datasource JSON
        working-directory: './grafana'
        run: |
          sed "s|__WORKSPACE_ID__|$WORKSPACE_ID|g; \
              s|\${__SUBSCRIPTION_ID__}|${{ secrets.AZURE_SUBSCRIPTION_ID }}|g; \
              s|\${__TENANT_ID__}|${{ secrets.AZURE_TENANT_ID }}|g" datasource.json > datasource_deploy.json

      - name: Debug datasource (opcional)
        run: cat grafana/datasource_deploy.json

      - name: Get Grafana endpoint
        run: |
          GRAFANA_URL=$(az grafana show --name grafana-rg-dev-projeto --resource-group rg-dev-projeto --query "properties.endpoint" -o tsv)
          echo "GRAFANA_URL=$GRAFANA_URL" >> $GITHUB_ENV

      - name: Deploy Grafana datasource
        run: |
          EXISTING=$(curl -s -H "Authorization: Bearer ${{ secrets.GRAFANA_API_KEY }}" "$GRAFANA_URL/api/datasources/name/AzureMonitor-Logs" | jq -r '.id // empty')
          if [ -n "$EXISTING" ]; then
            echo "Datasource já existe, atualizando..."
            curl -X PUT "$GRAFANA_URL/api/datasources/$EXISTING" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${{ secrets.GRAFANA_API_KEY }}" \
              --data-binary @grafana/datasource_deploy.json
          else
            echo "Datasource não existe, criando..."
            curl -X POST "$GRAFANA_URL/api/datasources" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${{ secrets.GRAFANA_API_KEY }}" \
              --data-binary @grafana/datasource_deploy.json
          fi

      - name: Deploy Dashboard
        working-directory: './grafana'
        run: |
          curl -s -X POST "$GRAFANA_URL/api/dashboards/db" \
            -H "Authorization: Bearer ${{ secrets.GRAFANA_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"dashboard\": $(cat dashboards/infra_azure.json), \"overwrite\": true}"


              