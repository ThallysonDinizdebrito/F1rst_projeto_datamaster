#         run: |
#           az functionapp config appsettings delete \
#             --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
#             --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
#             --setting-names WEBSITE_RUN_FROM_PACKAGE


# # 🚀 Deploy do código para Azure Function
