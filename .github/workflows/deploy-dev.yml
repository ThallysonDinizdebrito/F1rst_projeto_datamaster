      #     az functionapp config appsettings delete --name ${{ env.AZURE_FUNCTIONAPP_NAME_VALIDATE }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --setting-names WEBSITE_RUN_FROM_PACKAGE

      # - name: Deploy Azure Function - Deploy Package init
      #   uses: Azure/functions-action@v1
