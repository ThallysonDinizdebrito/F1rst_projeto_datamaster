name: Deploy Dev

on:
  push:
    branches:
      - dev

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: dev

    concurrency:
      group: terraform-dev
      cancel-in-progress: true

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      TF_VAR_secreto_do_cliente: ${{ secrets.AZURE_CLIENT_SECRET }}
      TF_VAR_id_do_cliente: ${{ secrets.AZURE_CLIENT_ID }}
      TF_VAR_id_do_tenant: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_id_da_subscricao: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      AZURE_FUNCTIONAPP_NAME: rg-dev-projeto-func
      AZURE_RESOURCE_GROUP: rg-dev-projeto
      RAW_CONTAINER_NAME: raw
      BLOB_DIRECTORY: json

    steps:
      - uses: actions/checkout@v3

      # - uses: hashicorp/setup-terraform@v2
      #   with:
      #     terraform_version: 1.7.0

      # # 🔹 Primeira parte: criar infra básica (sem subscription)
      # - name: Terraform Init -update
      #   working-directory: infra
      #   run: terraform init -reconfigure -upgrade

      # - name: Terraform Plan Infra
      #   working-directory: infra
      #   run: terraform plan -var-file=dev.tfvars -lock-timeout=300s

      # - name: Terraform Apply Infra
      #   working-directory: infra
      #   run: terraform apply -auto-approve -var-file=dev.tfvars -lock-timeout=300s

      # 🔹 Login Azure
      - name: Azure CLI Login
        uses: azure/login@v1
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }


      # 🚀 Deploy do código para Azure Function - Validate Blob
      - name: 'Azure Functions Action - validate'
        uses: Azure/functions-action@v1
        with:
          app-name: rg-dev-projeto-func-validate   # nome da azure function criada pelo Terraform
          package: './azure_function/functionvalidacao'
          enable-oryx-build: true
          scm-do-build-during-deployment: true

           # 🚀 Deploy do código para Azure Function limpeza de pacote

      - name: Clean old Azure Function package
        run: |
          az functionapp config appsettings delete \
            --name rg-dev-projeto-func-validate \
            --resource-group rg-dev-projeto \
            --setting-names WEBSITE_RUN_FROM_PACKAGE || true

          az functionapp restart \
            --name rg-dev-projeto-func-validate \
            --resource-group rg-dev-projeto

        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      # 🔹 Segunda parte: criar subscription depois do deploy
      - name: Terraform Apply Final (com subscription)
        working-directory: infra
        run: terraform apply -auto-approve -var-file=dev.tfvars -lock-timeout=300s
