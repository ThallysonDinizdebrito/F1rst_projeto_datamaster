name: Deploy Dev

on:
  push:
    branches:
      - dev

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: dev

    concurrency:
      group: terraform-dev
      cancel-in-progress: true

    env: # 🔑 Variáveis de ambiente globais (sem repetição)
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_secreto_do_cliente: ${{ secrets.AZURE_CLIENT_SECRET }}
      TF_VAR_id_do_cliente: ${{ secrets.AZURE_CLIENT_ID }}
      TF_VAR_id_do_tenant: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_id_da_subscricao: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - uses: actions/checkout@v3

      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.7.0

      # Terraform Init
      - name: Terraform Init
        working-directory: infra
        run: terraform init -reconfigure

      # Terraform Plan
      - name: Terraform Plan
        working-directory: infra
        run: terraform plan -var-file=dev.tfvars -lock-timeout=300s

      # Terraform Apply
      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve -var-file=dev.tfvars -lock-timeout=300s
