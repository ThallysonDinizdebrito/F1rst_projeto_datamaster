name: Deploy Dev

on:
  push:
    branches:
      - dev

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: dev

    concurrency:
      group: terraform-dev
      cancel-in-progress: true

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      TF_VAR_secreto_do_cliente: ${{ secrets.AZURE_CLIENT_SECRET }}
      TF_VAR_id_do_cliente: ${{ secrets.AZURE_CLIENT_ID }}
      TF_VAR_id_do_tenant: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_id_da_subscricao: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      AZURE_FUNCTIONAPP_NAME: rg-dev-projeto-func
      AZURE_RESOURCE_GROUP: rg-dev-projeto


    steps:
      - uses: actions/checkout@v3

      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        working-directory: infra
        run: terraform init -reconfigure

      - name: Terraform Plan
        working-directory: infra
        run: terraform plan -var-file=dev.tfvars -lock-timeout=300s

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve -var-file=dev.tfvars -lock-timeout=300s

      - name: Azure CLI Login
        uses: azure/login@v1
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Package Azure Function
        run: |
          cd azure_function
          zip -r ../azure_function.zip ./*

      - name: Deploy Azure Function
        run: |
          az functionapp deployment source config-zip \
            --name $AZURE_FUNCTIONAPP_NAME \
            --resource-group $AZURE_RESOURCE_GROUP \
            --src azure_function.zip

