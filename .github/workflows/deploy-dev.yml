###################################################################################
# GRAFANA DEPLOY
###################################################################################



  deploy_grafana:
    runs-on: ubuntu-latest
    environment: dev
    needs: setup-tf-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Azure CLI Login
        uses: azure/login@v1
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Generate workspace ID
        run: |
          WORKSPACE_ID="/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/rg-dev-projeto/providers/Microsoft.OperationalInsights/workspaces/law-rg-dev-projeto-dev"
          echo "WORKSPACE_ID=$WORKSPACE_ID" >> $GITHUB_ENV

      - name: Generate datasource JSON
        working-directory: './grafana'
        run: |
          sed "s|__WORKSPACE_ID__|$WORKSPACE_ID|g" datasource.json > datasource_deploy.json

      - name: Get Grafana endpoint
        run: |
          GRAFANA_URL=$(az grafana show --name grafana-rg-dev-projeto --resource-group rg-dev-projeto --query "properties.endpoint" -o tsv)
          echo "GRAFANA_URL=$GRAFANA_URL" >> $GITHUB_ENV

      - name: Deploy Grafana datasource
        run: |
          curl -X POST "$GRAFANA_URL/api/datasources" \
            -H "Content-Type: application/json" \
            -d @grafana/datasource_deploy.json