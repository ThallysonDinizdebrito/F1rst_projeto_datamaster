name: Deploy-resources-dev

on:
  push:
    branches:
      - dev

jobs:
  infra_functions:
    runs-on: ubuntu-latest
    environment: dev

    # steps: 
    # - name: Test Print
    #   run: echo "Este é um print no primeiro job dev..."

    concurrency:
      group: terraform-dev
      cancel-in-progress: true

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      TF_VAR_secreto_do_cliente: ${{ secrets.AZURE_CLIENT_SECRET }}
      TF_VAR_id_do_cliente: ${{ secrets.AZURE_CLIENT_ID }}
      TF_VAR_id_do_tenant: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_id_da_subscricao: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      AZURE_FUNCTIONAPP_NAME_VALIDATE: rg-dev-projeto-func-init
      AZURE_FUNCTIONAPP_NAME: rg-dev-projeto-func
      AZURE_RESOURCE_GROUP: rg-dev-projeto
      LOCATION: westeurope
      STORAGE_ACCOUNT: devprojetoarmazen
      SERVICE_PLAN: rg-dev-projeto-func-plan

    steps:
      # 1. Checkout do código
      - name: Checkout repository
        uses: actions/checkout@v3

      # - uses: hashicorp/setup-terraform@v2
      #   with:
      #     terraform_version: 1.7.0

      # - name: Terraform Init
      #   run: terraform -chdir=infra init

      # - name: Terraform Apply Infra 
      #   run: terraform -chdir=infra apply -auto-approve -var-file=dev.tfvars -target=azurerm_resource_group.grupo_principal -target=azurerm_storage_account.conta_armazenamento -target=azurerm_storage_container.container_raw -target=azurerm_storage_container.container_validado -target=azurerm_storage_container.container_rejeitados -target=azurerm_linux_function_app.function_app

      - name: Azure CLI Login
        uses: azure/login@v1
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      # 2. Configura Node.js (pré-requisito para func CLI)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      # 3. Cache do npm global para acelerar instalação da func CLI
      - name: Cache npm
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # 4. Instalar Azure Functions Core Tools (com cache do npm)
      - name: Install Azure Functions Core Tools
        run: |
          npm install -g azure-functions-core-tools@4 --unsafe-perm true

      # 5. Instala dependências Python (requirements.txt)
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        working-directory: ./azure_function/functionvalidacao
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      # 6. Deploy da Azure Function

      - name: Deploy Azure Function via func CLI
        working-directory: './azure_function/functionvalidacao'
        run: |
          func azure functionapp publish ${{ env.AZURE_FUNCTIONAPP_NAME_VALIDATE }} --build remote --python



      # - name: Create Function App func
      #   run: |
      #     # Cria a Function App Linux
      #       az functionapp create  --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --name ${{ env.AZURE_FUNCTIONAPP_NAME }} --storage-account ${{ env.STORAGE_ACCOUNT }} --consumption-plan-location westeurope --runtime python --runtime-version 3.11 --functions-version 4 --os-type Linux


      # - name: Deploy Azure Function -  Deploy Package func
      #   uses: Azure/functions-action@v1
      #   with:
      #     app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
      #     package: './azure_function/GeracaoData'
      #     enable-oryx-build: true
      #     scm-do-build-during-deployment: true

      # - name: Create Function App init
      #   run: |
      #     # Cria a Function App Linux
      #       az functionapp create  --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --name ${{ env.AZURE_FUNCTIONAPP_NAME_VALIDATE }} --storage-account ${{ env.STORAGE_ACCOUNT }} --consumption-plan-location westeurope --runtime python --runtime-version 3.11 --functions-version 4 --os-type Linux

      # - name: Clear Package
      #   run: |
      #     # Clear WEBSITE_RUN_FROM_PACKAGE
      #       az functionapp config appsettings delete --name ${{ env.AZURE_FUNCTIONAPP_NAME_VALIDATE }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --setting-names WEBSITE_RUN_FROM_PACKAGE


      # - name: Deploy Azure Function - Deploy Package init
      #   uses: Azure/functions-action@v1
      #   with:
      #     app-name: ${{ env.AZURE_FUNCTIONAPP_NAME_VALIDATE }}
      #     package: './azure_function/functionvalidacao'
