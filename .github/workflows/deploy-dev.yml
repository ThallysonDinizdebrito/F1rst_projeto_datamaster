name: Deploy Dev

on:
  push:
    branches:
      - dev

jobs:
  terraform:
    name: Terraform Dev
    runs-on: ubuntu-latest
    environment: desenvolvedor   # 👈 Importante: necessário para acessar segredos de ambiente

    steps:
      - name: Checar repositório
        uses: actions/checkout@v3

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.7.0

      - name: Autenticar no Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_DEV }}
          environment: 'dev'

      - name: Inicializar Terraform
        run: terraform init -backend-config="storage_account_name=${{ secrets.AZURE_STORAGE_ACCOUNT_DEV }}" \
                                -backend-config="container_name=tfstate" \
                                -backend-config="key=terraform.tfstate" \
                                -backend-config="resource_group_name=rg-backend-dev" \
                                -reconfigure
        working-directory: infra

      - name: Executar Terraform Plan
        run: terraform plan -var-file=dev.tfvars
        working-directory: infra

      - name: Executar Terraform Apply
        run: terraform apply -auto-approve -var-file=dev.tfvars
        working-directory: infra
