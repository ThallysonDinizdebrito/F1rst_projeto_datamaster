name: Teste Secrets parse

on:
  push:
    branches:
      - dev

jobs:
  debug-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checar se secrets existem
        run: |
          echo "🔎 Testando se os secrets existem..."

          if [ -z "${{ secrets.AZURE_CREDENTIALS_DEV }}" ]; then
            echo "❌ AZURE_CREDENTIALS_DEV está vazio"
          else
            echo "✅ AZURE_CREDENTIALS_DEV existe (conteúdo oculto por segurança)"
          fi

          if [ -z "${{ secrets.AZURE_CLIENT_ID }}" ]; then
            echo "❌ AZURE_CLIENT_ID está vazio"
          else
            echo "✅ AZURE_CLIENT_ID existe"
          fi

          if [ -z "${{ secrets.AZURE_TENANT_ID }}" ]; then
            echo "❌ AZURE_TENANT_ID está vazio"
          else
            echo "✅ AZURE_TENANT_ID existe"
          fi

          if [ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "❌ AZURE_SUBSCRIPTION_ID está vazio"
          else
            echo "✅ AZURE_SUBSCRIPTION_ID existe"
          fi

      - name: Validar se AZURE_CREDENTIALS_DEV é JSON válido
        run: |
          echo "${{ secrets.AZURE_CREDENTIALS_DEV }}" | jq empty
          if [ $? -eq 0 ]; then
            echo "✅ O secret AZURE_CREDENTIALS_DEV é um JSON válido"
          else
            echo "❌ O secret AZURE_CREDENTIALS_DEV NÃO é um JSON válido"
          fi
